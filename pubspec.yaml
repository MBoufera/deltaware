name: deltaware
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  equatable: ^2.0.8
  fpdart: ^1.2.0
  supabase_flutter: ^2.14.1
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.2
  easy_localization: ^3.0.8
  postgres: ^3.5.11
  pdf: ^3.12.0
  printing: ^5.14.3
  fl_chart: ^1.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  msix: ^3.16.13


flutter:
  uses-material-design: true
  assets:
    - assets/translations/

msix_config:
  display_name: Deltaware POS
  publisher_display_name: Deltaware Inc
  identity_name: com.deltaware.pos
  msix_version: 1.0.0
  logo_path: windows\runner\resources\app_icon.ico
  capabilities: internetClient
